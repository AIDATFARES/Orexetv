<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none" width="260" height="64">
  <defs>
    <!-- Icon Linear Gradient -->
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- TV Text Gradient -->
    <linearGradient id="tv-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON CONTAINER -->
  <g transform="translate(4, 8)">
    <!-- Squircle Drop Shadow Glow -->
    <rect x="0" y="0" width="48" height="48" rx="15" fill="#9333EA" opacity="0.35" filter="url(#purple-glow)" />

    <!-- Squircle Base -->
    <rect x="0" y="0" width="48" height="48" rx="15" fill="url(#icon-bg)" />

    <!-- White Double Arrow >> -->
    <g fill="#FFFFFF">
      <path d="M12 15 L22 24 L12 33 Z" />
      <path d="M22 15 L32 24 L22 33 Z" />
    </g>

    <!-- Neon Cyan Accent Dot -->
    <circle cx="44" cy="4" r="5.5" fill="#00F0FF" stroke="#06040F" stroke-width="2" />
  </g>

  <!-- TYPOGRAPHY & BADGE -->
  <g transform="translate(64, 0)">
    <!-- Main Brand Name OREXE TV -->
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="27" fill="#FFFFFF" letter-spacing="-0.5">OREXE</text>
    <text x="108" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="27" fill="url(#tv-text-grad)" letter-spacing="-0.5">TV</text>

    <!-- Subtitle Capsule [IPTV] -->
    <rect x="0" y="43" width="34" height="15" rx="4" fill="#000000" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.6" />
    <text x="4.5" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="9" fill="#00F0FF" letter-spacing="1">IPTV</text>

    <!-- Subtitle 4K ULTRA -->
    <text x="42" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="9.5" fill="#94A3B8" letter-spacing="1.8">4K ULTRA</text>
  </g>
</svg>

